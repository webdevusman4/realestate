<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Forms</title></head>
  <body>
    <!-- Registers the estimate form with Netlify Forms. The real form posts here from the client. -->
    <form name="estimate" data-netlify="true" netlify-honeypot="company" hidden>
      <input name="company" />
      <input name="name" />
      <input name="phone" />
      <input name="type" />
      <input name="plot" />
      <input name="city" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
